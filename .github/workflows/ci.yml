# .github/workflows/ci.yml
#
# Every push/PR is verified inside the exact same dev container that
# contributors use (design doc §10.5/10.6), so host toolchain drift cannot
# sneak into a green pipeline.

name: CI

on:
  push:
  pull_request:

# This job only reads the tree. Saying so explicitly means a compromised
# action — or a pull request from a fork — cannot use the job's token to write
# to the repository, whatever the repository-wide default happens to be.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image
        run: docker compose build dev
      - name: Configure, build, unit test, and smoke-test
        run: docker compose run --rm dev ./scripts/ci.sh