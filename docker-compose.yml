# docker-compose.yml
#
# `docker compose run --rm dev` is the default onboarding path (design doc
# §10). The dev service bind-mounts the live repo read/write so edits never
# need an image rebuild, and uses named volumes to keep CMake artifacts and
# kap's caches out of the source tree (so `git status` stays clean).
#
# Usage:
#   docker compose run --rm dev                    # interactive shell
#   docker compose run --rm dev ./scripts/ci.sh    # one-shot CI
#
# `dev-full` (design doc §10.5) adds the ecosystem toolchains the first-party
# plugins drive — Rust, Node, Go, Python/uv — for the last-mile check that the
# argv arrays kap produces are ones the real tools accept. It is behind a
# compose profile so it is never built unless asked for: it is roughly ten times
# the size of `dev` and tracks four upstream release cadences, and nobody fixing
# a typo in the TOML parser should wait on a Rust download.
#
#   docker compose --profile full build dev-full
#   docker compose --profile full run --rm dev-full ./scripts/ci-full.sh

services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    # A tiny PID-1 shim reaps orphaned child processes inside the container,
    # so a stray background test can never linger and confuse later runs.
    init: true
    volumes:
      # Live repo: host edits appear in the container instantly.
      - .:/kap
      # Persistent scratch volumes keep the bind mount free of build junk.
      - kap-build:/kap/build
      # scripts/ci.sh also configures a second, -DKAP_EMBED_PLUGINS=ON tree.
      # It lives *outside* /kap, addressed by $KAP_EMBED_BUILD_DIR: the
      # container runs as root, so anything it creates inside the bind mount —
      # even an empty mountpoint — lands root-owned in the developer's working
      # copy and cannot be removed without sudo.
      - kap-embed-build:/kap-build-embed
      - kap-cache:/root/.cache/kap
      - kap-config:/root/.config/kap
    working_dir: /kap
    environment:
      - KAP_EMBED_BUILD_DIR=/kap-build-embed
    # Interactive defaults: keep stdin open with a TTY so you drop straight
    # into a working shell with history and colours.
    stdin_open: true
    tty: true

  # The ecosystem image. Same repo mount and the same entrypoint; separate
  # build/cache volumes so switching between the two images does not force a
  # full rebuild each time, and so a Rust target/ directory never lands in the
  # `dev` image's cache.
  dev-full:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/dev-full.Dockerfile
    init: true
    volumes:
      - .:/kap
      - kap-full-build:/kap/build
      - kap-full-embed-build:/kap-build-embed
      - kap-full-cache:/root/.cache
      - kap-config:/root/.config/kap
    working_dir: /kap
    environment:
      - KAP_EMBED_BUILD_DIR=/kap-build-embed
    stdin_open: true
    tty: true

volumes:
  kap-build:
  kap-embed-build:
  kap-cache:
  kap-config:
  kap-full-build:
  kap-full-embed-build:
  kap-full-cache: